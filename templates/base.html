<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Appointment Booking{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <div class="brand">AppointFlow</div>
  <nav>
    <a href="{{ url_for('index') }}">Book</a>
    <a href="{{ url_for('appointments') }}">Appointments</a>
  </nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages() %}
    {% for message in messages %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Agile Methodologies Project • Scrum + Kanban</footer>
</body>
</html>
